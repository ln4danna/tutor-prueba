{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>Iniciar sesión</h1>
  <p class="muted">Accede para estudiar tus lecciones con el tutor.</p>
  {% if error %}
  <p class="alert alert-error" role="alert" id="login-error">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login" class="form" id="login-form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required maxlength="255"
           value="{{ email or '' }}" autofocus>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required
           maxlength="255">
    <button type="submit" class="btn btn-primary" id="login-submit">Entrar</button>
  </form>
</section>
{% endblock %}
